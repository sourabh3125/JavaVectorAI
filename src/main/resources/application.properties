server.port=8080

# Ollama settings — change host if Ollama runs on a different machine
ollama.host=http://127.0.0.1:11434
ollama.embed-model=nomic-embed-text
ollama.gen-model=llama3.2

# How many dimensions the demo vectors use
vectordb.demo-dims=16

# Chunk size for document splitting (words)
vectordb.chunk-words=250
vectordb.chunk-overlap=30

# Logging
logging.level.com.vectordb=INFO
